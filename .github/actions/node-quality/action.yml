name: Node quality checks
description: Install dependencies, lint, typecheck, test, build, and pack check

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Lint
      run: npm run lint
      shell: bash

    - name: Typecheck
      run: npm run typecheck
      shell: bash

    - name: Test
      run: npm test
      shell: bash

    - name: Build
      run: npm run build
      shell: bash

    - name: Pack check
      run: |
        set -euo pipefail
        npm pack --dry-run 2>&1 | tee /tmp/pack.txt
        grep -q 'dist/web/index.html' /tmp/pack.txt || {
          echo "::error::dist/web/index.html missing from package"
          exit 1
        }
      shell: bash
